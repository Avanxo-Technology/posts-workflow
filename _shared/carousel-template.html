<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__BRAND__ · Carrusel – __TITLE__</title>
<link href="__FONTS__" rel="stylesheet">
<style>
:root{--c1:__C1__;--c2:__C2__;--acento:__ACCENT__}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#cfcdc4;font-family:'__BODY__',system-ui,sans-serif}
.board{display:flex;gap:40px;padding:40px;width:max-content;zoom:.42}
body.single{background:#000}
body.single .board{zoom:1;padding:0;gap:0}
body.single .slide:not(.show){display:none}
.slide{width:1080px;height:1350px;position:relative;overflow:hidden;flex:none}
.dark{background:var(--c1);color:var(--c2)} .light{background:var(--c2);color:var(--c1)}
.abs{position:absolute}
.brand{position:absolute;left:70px;top:70px;font:800 34px '__HEAD__';letter-spacing:.16em;text-transform:uppercase}
.giant{position:absolute;left:60px;font-family:'__HEAD__',sans-serif;font-weight:800;text-transform:uppercase;line-height:.9;letter-spacing:-.02em}
.giant em{font-style:normal;color:var(--acento)}
</style></head><body>
<div class="board">
  <section class="slide dark"><!-- 1 portada -->
    <div class="brand">__BRAND__</div>
    <h1 class="giant" style="top:300px;font-size:170px">Titular<br><em>gigante</em></h1>
  </section>
  <section class="slide light"><!-- 2 contenido --></section>
  <section class="slide dark"><!-- 3 contacto / llamada a la acción --></section>
</div>
<script>
  var s=new URLSearchParams(location.search).get('s');
  if(s){document.body.classList.add('single');
        document.querySelectorAll('.slide')[+s-1].classList.add('show')}
</script></body></html>
