<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AGA · Video – TÍTULO</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../_shared/aga.css">
<style>
/* estilos propios de ESTE video (el sistema visual común está en _shared/aga.css) */
.s1 .g1{left:40px;top:262px;font-size:200px;color:var(--paper)}
.s1 .g2{left:34px;top:440px;font-size:180px;color:var(--lime)}
.s2 .g1{left:36px;top:262px;font-size:190px;color:var(--navy)}
.s2 .cta{left:64px;top:1330px}
.s2 .contact{left:64px;top:1470px}
</style>
</head>
<body>
<div id="holder"><div id="stage"><div id="world">

  <!-- ESCENA 1 · portada (0 – 4 s). Cada escena: <section class="scene ..." style="--s:INICIO;--d:DURACIÓN"> -->
  <section class="scene nv bg-nv s1" style="--s:0s;--d:4s">
    <img class="logo k" style="--n:fade;--s:.1s;--t:.4s" src="img/logo-white.png" alt="AGA Growth Advisors">
    <div class="pill k" style="--n:pop;--s:.25s;--t:.4s">Etiqueta</div>
    <div class="giant g1 clip"><span class="k" style="--n:lineUp;--s:.35s;--t:.6s">Titular</span></div>
    <div class="giant g2 clip"><span class="k" style="--n:lineUp;--s:.6s;--t:.6s">gigante</span></div>
  </section>

  <!-- ESCENA 2 · cierre (4 – 8 s). La transición 'wipe' (t0=3.5, dur .9) tapa la pantalla en t0+.504 = 4.0 -->
  <section class="scene pp bg-pp s2" style="--s:4s;--d:4s">
    <img class="logo k" style="--n:fade;--s:4.1s;--t:.4s" src="img/logo-dark.png" alt="AGA Growth Advisors">
    <div class="giant g1 clip"><span class="k" style="--n:lineUp;--s:4.3s;--t:.55s">Habla con AGA</span></div>
    <div class="cta k" style="--n:pop;--s:5s;--t:.5s">Escríbenos</div>
    <div class="contact k" style="--n:rise;--s:5.4s;--t:.5s"><b>+57 320 478 4126</b>aga-growth.com · info@aga-growth.net</div>
  </section>

  <canvas class="cv" id="cv-tr" width="1080" height="1920"></canvas>
</div></div></div>

<div id="bar">
  <button id="pp">PAUSA</button><button id="rs" class="sec">↺</button><button id="snd" class="sec">SONIDO</button>
  <div id="track"><div id="fill"></div></div><div id="clock">0:00 / 0:08</div>
</div>
<div id="hint">Espacio: pausa · ← → : ±1 s · R: reiniciar · SONIDO: activa los efectos (sfx.wav) · clic en la barra: ir a un momento</div>
<audio id="au" src="sfx.wav" preload="auto"></audio>

<script>
/* Los tiempos de aquí se repiten en gen_audio.py (TOTAL, transiciones y golpes). Transiciones: 'wipe' | 'bars' | 'iris' */
var VIDEO={
  total:8,
  trans:[
    {t0:3.5, dur:.9, type:'wipe'}    /* swap 4.0 */
  ],
  hits:[],
  frame:function(t){ /* contadores o cosas calculadas por tiempo (opcional) */ }
};
</script>
<script src="../../../_shared/engine.js"></script>
</body>
</html>
